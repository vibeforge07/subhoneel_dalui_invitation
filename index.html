  <!-- The loader lives here, not in React, so it is on screen from the first paint.
       It moves only with transform and opacity, so it keeps flying smoothly while the page is busy loading. -->
  <style>
    html, body { margin: 0; background: #160307; }
    .loader { position: fixed; inset: 0; z-index: 300; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(circle at 50% 45%, #4c0b17, #160307 72%); transition: opacity 1s cubic-bezier(0.65, 0, 0.35, 1), visibility 1s; }
    .is-ready .loader { opacity: 0; visibility: hidden; pointer-events: none; }
    .ldr__stage { position: relative; width: 120px; height: 84px; opacity: 0; transform: translateY(14px) scale(0.92);
      animation: ldrIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards; }
    .ldr__float { position: absolute; inset: 0; animation: ldrFloat 3.2s ease-in-out 1.2s infinite alternate; will-change: transform; }
    .ldr__glow { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%;
      background: radial-gradient(circle, rgba(240, 200, 120, 0.28), rgba(240, 200, 120, 0) 62%); animation: ldrGlow 2.8s ease-in-out infinite alternate; will-change: transform, opacity; }
    .ldr__part { position: absolute; inset: 0; width: 120px; height: 84px; color: #e0bd72; overflow: visible; }
    .ldr__wing { transform-origin: 50% 50%; animation: ldrFlap 1.5s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate; will-change: transform; }
    .ldr__line { margin: 0; font-family: "Tiro Bangla", "Noto Serif Bengali", serif; font-size: 17px; color: #f6e3a8; opacity: 0; animation: ldrFade 1.2s ease 0.6s forwards; }
    .ldr__bar { width: 170px; height: 1px; background: rgba(224, 189, 114, 0.18); overflow: hidden; opacity: 0; animation: ldrFade 1s ease 0.9s forwards; }
    .ldr__bar i { display: block; height: 100%; width: 100%; background: #e0bd72; transform-origin: left; transform: scaleX(var(--p, 0)); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes ldrIn { to { opacity: 1; transform: none; } }
    @keyframes ldrFloat { from { transform: translateY(3px); } to { transform: translateY(-5px); } }
    @keyframes ldrFlap { from { transform: scaleX(1); } to { transform: scaleX(0.62); } }
    @keyframes ldrGlow { from { opacity: 0.55; transform: scale(0.9); } to { opacity: 1; transform: scale(1.06); } }
    @keyframes ldrFade { to { opacity: 0.85; } }
    @media (prefers-reduced-motion: reduce) { .ldr__wing, .ldr__float, .ldr__glow { animation: none; } }
  </style>
</head>
<body>
  <div class="loader" id="loader" aria-hidden="true">
    <div class="ldr__stage">
      <div class="ldr__glow"></div>
      <div class="ldr__float">

        <svg class="ldr__part" viewBox="0 0 120 84"><path d="M58.5 19C55 12 50 8 45 7c-2.2-.4-3 2-1 2.6M61.5 19C65 12 70 8 75 7c2.2-.4 3 2 1 2.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M60 24c2.2 0 3 3 3 6v28c0 4-1.4 9-3 9s-3-5-3-9V30c0-3 .8-6 3-6z" fill="currentColor"/></svg>
      </div>
    </div>
    <p class="ldr__line">প্রজাপতয়ে নমঃ</p>
    <div class="ldr__bar"><i id="loaderBar"></i></div>
  </div>
